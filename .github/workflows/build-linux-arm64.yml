name: Build Linux ARM64 (Orange Pi)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Runner ARM64 nativo: o Flutter não compila Linux de forma cruzada.
    # Ubuntu 24.04 (glibc 2.39) gera binários compatíveis com Debian 13
    # (glibc 2.41) do Armbian no Orange Pi.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Flutter
        uses: actions/cache@v4
        with:
          path: ~/flutter
          key: flutter-linux-arm64-3.41.4

      - name: Compilar
        run: ./scripts/build_linux_arm64.sh

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: pesagem-totem-linux-arm64
          path: dist/*.tar.gz

      - name: Anexar à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
